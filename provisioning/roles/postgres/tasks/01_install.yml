---
# tasks file for postgresql

- name: install OS dependencies
  apt:
    name: "{{ debian_dependencies }}"
    state: present
  tags: install

- name: ensure apt keyring directory exists
  become: true
  file:
    path: "{{ apt_keyring_dir }}"
    state: directory
    mode: '0755'
  tags: install

- name: add GPG signing key
  become: true
  get_url:
    url: "https://www.postgresql.org/media/keys/ACCC4CF8.asc"
    dest: "{{ apt_keyring_dir }}/postgresql.asc"
    mode: '0644'
  tags: install

# copy (not apt_repository): replace lines of older debian releases
- name: add official repository
  become: true
  copy:
    dest: /etc/apt/sources.list.d/pgdg.list
    content: "deb [signed-by={{ apt_keyring_dir }}/postgresql.asc] https://apt.postgresql.org/pub/repos/apt/ {{ postgres_apt_suite }} main\n"
    mode: '0644'
  register: postgresql_repo
  tags: install

- name: udpate apt cache
  become: true
  when: postgresql_repo.changed
  apt:
    update_cache: true
  tags: install

- name: establish dependencies
  become: true
  apt:
    name: "{{ item }}"
    state: present
  loop: "{{ postgres_dependencies }}"
  tags: install

- name: add timescale GPG signing key
  become: true
  get_url:
    url: "https://packagecloud.io/timescale/timescaledb/gpgkey"
    dest: "{{ apt_keyring_dir }}/timescaledb.asc"
    mode: '0644'
  tags: install

- name: add timescale repository
  become: true
  copy:
    dest: /etc/apt/sources.list.d/timescaledb.list
    content: "deb [signed-by={{ apt_keyring_dir }}/timescaledb.asc] https://packagecloud.io/timescale/timescaledb/debian/ {{ timescaledb_apt_suite }} main\n"
    mode: '0644'
  register: timescale_repo
  tags: install

- name: udpate apt cache
  become: true
  when: timescale_repo.changed
  apt:
    update_cache: true
  tags: install

- name: install timescaledb and dependencies
  become: true
  apt:
    name: timescaledb-2-postgresql-{{postgres_version}}
    state: present
  tags: install

- name: ensure the PostgreSQL service is running and enabled
  become: true
  service:
    name: postgresql
    state: started
    enabled: true
  tags:
    - install
    - configure
