---
# tasks file for docker

- name: install OS dependencies
  become: true
  apt:
    name: "{{ docker_os_dependencies }}"
    state: present
  tags: install

- name: ensure apt keyring directory exists
  become: true
  file:
    path: "{{ docker_apt_keyring | dirname }}"
    state: directory
    mode: '0755'
  tags: install

- name: add GPG signing key
  become: true
  get_url:
    url: "{{ docker_apt_uri }}/gpg"
    dest: "{{ docker_apt_keyring }}"
    mode: '0644'
  tags: install

- name: add official repository
  become: true
  deb822_repository:
    name: docker
    types: deb
    uris: "{{ docker_apt_uri }}"
    suites: "{{ docker_apt_suite }}"
    components: stable
    architectures: "{{ docker_apt_arch }}"
    signed_by: "{{ docker_apt_keyring }}"
    state: present
  register: docker_repo
  tags: install

# superseded by docker.sources
- name: remove legacy one-line repository file
  become: true
  file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  register: docker_legacy_repo
  tags: install

- name: remove docker key from legacy global apt keyring
  become: true
  shell: |
    test -f /etc/apt/trusted.gpg || exit 0
    gpg --no-default-keyring --keyring /etc/apt/trusted.gpg --list-keys {{ docker_legacy_key_fingerprint }} >/dev/null 2>&1 || exit 0
    gpg --no-default-keyring --keyring /etc/apt/trusted.gpg --batch --yes --delete-keys {{ docker_legacy_key_fingerprint }}
    echo removed
  register: docker_legacy_key
  changed_when: "'removed' in docker_legacy_key.stdout"
  tags: install

- name: udpate apt cache
  become: true
  when: docker_repo.changed or docker_legacy_repo.changed
  apt:
    update_cache: true
  tags: install

- name: establish dependencies
  become: true
  apt:
    name: "{{ docker_dependencies }}"
    state: present
  tags: install

# a standalone docker-compose binary was once installed manually to /usr/local/bin;
# forward to the compose plugin instead so the two can't drift apart
- name: forward docker-compose to the compose plugin
  become: true
  copy:
    dest: /usr/local/bin/docker-compose
    content: |
      #!/bin/sh
      # managed by ansible (docker role)
      exec docker compose "$@"
    mode: '0755'
    backup: true
  tags: install

- name: ensure the docker service is running and enabled
  become: true
  service:
    name: docker
    state: started
    enabled: true
  tags:
    - install
    - configure
